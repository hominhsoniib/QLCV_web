<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Đăng nhập Mobile - AMS PRO 5.0</title>
  
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f172a">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/mobile.css">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .mobile-login-card {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 28px 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      backdrop-filter: blur(16px);
    }
  </style>
</head>
<body>
  <div class="mobile-login-card text-white">
    <div class="text-center mb-4">
      <div class="h2 font-weight-bold text-primary mb-1">
        <i class="fa-solid fa-layer-group me-2"></i>AMS PRO 5.0
      </div>
      <div class="text-secondary small">Hệ thống Quản lý Công việc Mobile</div>
    </div>

    <div id="login-alert" class="alert alert-danger py-2 small d-none"></div>

    <form id="mobile-login-form">
      <div class="mb-3">
        <label class="form-label small text-secondary">Mã số thuế Công ty (Nếu có)</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary border-opacity-50 text-secondary">
            <i class="fa-solid fa-building"></i>
          </span>
          <input type="text" id="tax_code" class="form-control bg-dark text-white border-secondary border-opacity-50" placeholder="VD: 0101234567">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label small text-secondary">Tài khoản / Email / Mã NV *</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary border-opacity-50 text-secondary">
            <i class="fa-solid fa-user"></i>
          </span>
          <input type="text" id="username" class="form-control bg-dark text-white border-secondary border-opacity-50" placeholder="VD: CEO hoặc NV001" required>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label small text-secondary">Mật khẩu *</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary border-opacity-50 text-secondary">
            <i class="fa-solid fa-lock"></i>
          </span>
          <input type="password" id="password" class="form-control bg-dark text-white border-secondary border-opacity-50" placeholder="Nhập mật khẩu..." required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 rounded-pill py-2.5 font-weight-bold">
        <i class="fa-solid fa-right-to-bracket me-2"></i>Đăng Nhập Mobile
      </button>
    </form>
    
    <div class="text-center mt-3">
      <a href="/login" class="text-secondary small text-decoration-none">
        <i class="fa-solid fa-desktop me-1"></i>Đến trang Đăng nhập Desktop
      </a>
    </div>
  </div>

  <script>
    document.getElementById('mobile-login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const alertBox = document.getElementById('login-alert');
      alertBox.classList.add('d-none');
      
      const tax_code = document.getElementById('tax_code').value.trim();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      
      try {
        const formData = new FormData();
        formData.append('username', username);
        formData.append('password', password);
        if (tax_code) formData.append('tax_code', tax_code);

        const res = await fetch('/api/auth/login', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        
        if (data.success) {
          window.location.href = '/mobile/dashboard';
        } else {
          alertBox.innerText = data.message || 'Đăng nhập không thành công!';
          alertBox.classList.remove('d-none');
        }
      } catch (err) {
        alertBox.innerText = 'Lỗi kết nối máy chủ.';
        alertBox.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
