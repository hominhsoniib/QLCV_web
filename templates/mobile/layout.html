<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>{% block title %}QLCV Mobile - AMS PRO 5.0{% endblock %}</title>
  
  <!-- PWA & Mobile Web App Meta -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="QLCV Mobile">
  <link rel="apple-touch-icon" href="/static/css/icon-192.png">

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  
  <!-- Mobile Framework Stylesheet -->
  <link rel="stylesheet" href="/static/css/mobile.css">
  
  {% block extra_css %}{% endblock %}
</head>
<body class="mobile-body">

  <!-- Top Sticky Header -->
  <header class="mobile-top-bar">
    <div class="mobile-brand-title">
      <i class="fa-solid fa-layer-group text-primary"></i>
      <span>AMS PRO 5.0</span>
    </div>
    <div class="d-flex align-items-center gap-2">
      <span class="badge bg-primary rounded-pill px-2 py-1" style="font-size: 0.7rem;">
        <i class="fa-solid fa-user me-1"></i>{{ user.ten_nv or user.ma or 'User' }}
      </span>
      <a href="/dashboard" class="text-secondary text-decoration-none ms-1" title="Bản Desktop">
        <i class="fa-solid fa-desktop" style="font-size: 1.1rem;"></i>
      </a>
    </div>
  </header>

  <!-- Main View Container -->
  <main class="mobile-container">
    {% block content %}{% endblock %}
  </main>

  <!-- Bottom App Navigation Bar -->
  <nav class="mobile-bottom-nav">
    <a href="/mobile/dashboard" class="mobile-nav-item {% if active_tab == 'dashboard' %}active{% endif %}">
      <i class="fa-solid fa-house"></i>
      <span>Trang chủ</span>
    </a>
    <a href="/mobile/tasks" class="mobile-nav-item {% if active_tab == 'tasks' %}active{% endif %}">
      <i class="fa-solid fa-list-check"></i>
      <span>Công việc</span>
    </a>
    <a href="/mobile/ai" class="mobile-nav-item {% if active_tab == 'ai' %}active{% endif %}">
      <i class="fa-solid fa-robot"></i>
      <span>Trợ lý AI</span>
    </a>
    <a href="/mobile/menu" class="mobile-nav-item {% if active_tab == 'menu' %}active{% endif %}">
      <i class="fa-solid fa-bars"></i>
      <span>Menu</span>
    </a>
  </nav>

  <!-- Register PWA Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('PWA ServiceWorker registered:', reg.scope))
          .catch(err => console.log('PWA ServiceWorker registration failed:', err));
      });
    }
  </script>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
