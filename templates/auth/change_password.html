{% extends "layout.html" %}

{% block title %}AMS PRO 5.0 - Đổi mật khẩu{% endblock %}

{% block extra_css %}
<style>
  .change-password-container {
    max-width: 500px;
    margin: 40px auto;
  }
  .card-premium-gradient {
    position: relative;
    overflow: hidden;
  }
  .card-premium-gradient::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 4px;
    background: linear-gradient(90deg, var(--accent-blue), var(--accent-cyan));
  }
  .form-group-lux {
    margin-bottom: 22px;
  }
  .input-group-lux {
    display: flex;
    align-items: center;
    background: rgba(10, 15, 29, 0.6);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    overflow: hidden;
    transition: all 0.3s ease;
  }
  .input-group-lux:focus-within {
    border-color: var(--accent-blue);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
  }
  .input-group-icon {
    padding: 10px 16px;
    color: var(--accent-blue);
    font-size: 16px;
    width: 48px;
    text-align: center;
  }
  .input-group-lux input {
    border: none !important;
    background: transparent !important;
    color: var(--text-main) !important;
    height: 44px !important;
    width: 100%;
    padding: 8px 12px 8px 0 !important;
    outline: none !important;
    font-size: 14px;
  }
  .input-group-lux input::placeholder {
    color: var(--text-muted);
  }
  .toggle-password {
    padding: 10px 16px;
    cursor: pointer;
    color: var(--text-muted);
    transition: color 0.2s;
  }
  .toggle-password:hover {
    color: var(--text-main);
  }
  .form-header {
    text-align: center;
    margin-bottom: 30px;
  }
  .form-header h2 {
    font-size: 22px;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #ffffff, var(--accent-cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .form-header p {
    color: var(--text-muted);
    font-size: 13px;
  }
</style>
{% endblock %}

{% block content %}
<div class="change-password-container">
  <div class="premium-card card-premium-gradient">
    <div class="form-header">
      <h2><i class="fas fa-key mr-2 text-primary"></i> Đổi mật khẩu</h2>
      <p>Cập nhật mật khẩu để bảo mật tài khoản cá nhân của bạn</p>
    </div>
    
    <form id="changePasswordForm" onsubmit="handleChangePassword(event)">
      <div class="form-group-lux">
        <label class="field-label">Mật khẩu hiện tại</label>
        <div class="input-group-lux">
          <span class="input-group-icon"><i class="fas fa-lock"></i></span>
          <input id="oldPass" type="password" placeholder="Nhập mật khẩu hiện tại" required autocomplete="current-password">
          <span class="toggle-password" onclick="toggleField('oldPass', 'eyeOld')"><i id="eyeOld" class="fas fa-eye"></i></span>
        </div>
      </div>
      
      <div class="form-group-lux">
        <label class="field-label">Mật khẩu mới</label>
        <div class="input-group-lux">
          <span class="input-group-icon"><i class="fas fa-key"></i></span>
          <input id="newPass" type="password" placeholder="Nhập mật khẩu mới" required autocomplete="new-password">
          <span class="toggle-password" onclick="toggleField('newPass', 'eyeNew')"><i id="eyeNew" class="fas fa-eye"></i></span>
        </div>
      </div>

      <div class="form-group-lux">
        <label class="field-label">Xác nhận mật khẩu mới</label>
        <div class="input-group-lux">
          <span class="input-group-icon"><i class="fas fa-shield"></i></span>
          <input id="confirmPass" type="password" placeholder="Nhập lại mật khẩu mới" required autocomplete="new-password">
          <span class="toggle-password" onclick="toggleField('confirmPass', 'eyeConfirm')"><i id="eyeConfirm" class="fas fa-eye"></i></span>
        </div>
      </div>
      
      <div class="d-flex justify-content-between align-items-center mt-4">
        <a href="/dashboard" class="btn-lux-secondary">
          <i class="fas fa-arrow-left mr-2"></i> Quay lại
        </a>
        <button type="submit" id="btnSubmit" class="btn-lux-primary">
          Cập nhật <i class="fas fa-save ml-2"></i>
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  // Hide global loader if active
  toggleLoader(false);

  function toggleField(inputId, eyeId) {
    const input = document.getElementById(inputId);
    const eye = document.getElementById(eyeId);
    if (input && eye) {
      if (input.type === "password") {
        input.type = "text";
        eye.classList.replace("fa-eye", "fa-eye-slash");
      } else {
        input.type = "password";
        eye.classList.replace("fa-eye-slash", "fa-eye");
      }
    }
  }

  function handleChangePassword(event) {
    event.preventDefault();
    
    const oldPassVal = document.getElementById("oldPass").value;
    const newPassVal = document.getElementById("newPass").value;
    const confirmPassVal = document.getElementById("confirmPass").value;
    const btn = document.getElementById("btnSubmit");
    
    if (newPassVal !== confirmPassVal) {
      showToast("error", "⚠️ Mật khẩu xác nhận không khớp!");
      return;
    }
    
    if (newPassVal.length < 4) {
      showToast("error", "⚠️ Mật khẩu mới phải từ 4 ký tự trở lên!");
      return;
    }
    
    toggleLoader(true, "ĐANG CẬP NHẬT MẬT KHẨU...");
    btn.disabled = true;
    
    const formData = new FormData();
    formData.append("oldPass", oldPassVal);
    formData.append("newPass", newPassVal);
    
    fetch("/api/auth/change-password", {
      method: "POST",
      body: formData
    })
    .then(res => res.json())
    .then(data => {
      toggleLoader(false);
      btn.disabled = false;
      
      if (data.success) {
        showNotify("success", "Thành công", data.message || "Đổi mật khẩu thành công!", () => {
          window.location.href = "/dashboard";
        });
      } else {
        showNotify("error", "Thất bại", data.message || "Không thể đổi mật khẩu.");
      }
    })
    .catch(err => {
      toggleLoader(false);
      btn.disabled = false;
      showNotify("error", "Lỗi kết nối", "Không thể kết nối đến máy chủ: " + err.message);
    });
  }
</script>
{% endblock %}
